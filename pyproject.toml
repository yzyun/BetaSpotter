[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boulderai"
version = "0.1.0"
description = "Analyse a bouldering video and point out technique mistakes with annotated screenshots."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
boulderai = "boulderai.cli:app"

[tool.setuptools.packages.find]
include = ["boulderai*"]

[tool.setuptools.package-data]
boulderai = ["rules/config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
